# Application & Automation Configuration
app.url=https://saucedemo.com
browser=chrome
headless=true
timeout.implicit=10
timeout.explicit=15

# Database Configuration (In-Memory H2 Engine for SQL Verification)
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1;MODE=MySQL
db.user=sa
db.password=

# Reporting Configuration
report.path=test-output/ExtentReport.html
report.title=DataShield E-Commerce & DB Validation Automation Report
report.name=E2E Selenium & SQL Database Automation Suite
